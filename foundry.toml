[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
via_ir = true
optimizer = true
optimizer_runs = 200
bytecode_hash = "none"
fs_permissions = [{ access = "read", path = "./test/fixtures" }]
remappings = [
  "forge-std/=lib/forge-std/src/",
  "bls/=vendor/bls-solidity/src/",
]

[profile.default.fuzz]
runs = 256
